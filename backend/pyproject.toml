[project]
name = "enterprise-idp-backend"
version = "0.1.0"
description = "Enterprise IDP Studio backend"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "celery[redis]>=5.4.0",
  "fastapi>=0.116.0",
  "greenlet>=3.0.3",
  "httpx>=0.28.0",
  "pdfplumber>=0.11.0",
  "pillow>=11.0.0",
  "pydantic-settings>=2.4.0",
  "python-dateutil>=2.9.0",
  "python-multipart>=0.0.12",
  "pytesseract>=0.3.13",
  "redis>=5.1.0",
  "sqlalchemy[asyncio]>=2.0.35",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
